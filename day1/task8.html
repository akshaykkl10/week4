<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart</title>
    <script src="task8.js" defer></script>
    <style>
        #sales-chart {
            border: 1px solid;
        }
        .chart-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #tooltip {
            position: fixed;
            display: none;
            padding: 8px;
            background: black;
            color: white;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="sales-chart" width="1800" height="800"></canvas>
        <button id="download-chart">Download PNG</button>
    </div>
    <div id="tooltip"></div>
</body>
</html>
