<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kan Ban Board</title>
    <link rel="stylesheet" href="styles.css">
    <script src="db.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <div class="board">
        <div class="header"><h1>KanBan Board</h1></div>
        <div class="todo">
            <h1>To Do</h1>
            <div class="cards" data-column="todo"></div>
            <form>
                <input type="text" name="task">
                <button type="submit" class="addbtn">Add</button>
            </form>
        </div>
        <div class="inprogress">
            <h1>In Progress</h1>
            <div class="cards" data-column="inprogress"></div>
            <form>
                <input type="text" name="task">
                <button type="submit" class="addbtn">Add</button>
            </form>

        </div>
        <div class="done">
            <h1>Done</h1>
            <div class="cards" data-column="done"></div>
            <form>
                <input type="text" name="task">
                <button type="submit" class="addbtn">Add</button>
            </form>
        </div>
        <div class="delete">
            <h1>Delete</h1>
        </div>
    </div>
</body>
</html>
